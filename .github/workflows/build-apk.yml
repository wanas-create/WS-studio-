name: Build WS-Studio APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List all files
        run: |
          ls -la
          echo "--- Finding pubspec ---"
          find. -name "pubspec.yaml"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Build APK (Auto Find Project)
        run: |
          PUB=$(find. -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUB" ]; then
            echo "pubspec.yaml nahi mila! Repo khali hai!"
            exit 1
          fi
          DIR=$(dirname "$PUB")
          echo "Project mila: $DIR me"
          cd "$DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WS-Studio-APK
          path: |
            **/app-release.apk
            **/app-debug.apk
