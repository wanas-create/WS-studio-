name: Build WS-Studio APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List all files
        run: |
          ls -la
          find. -name "pubspec.yaml" | head -20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Build APK
        run: |
          PUB=$(find. -name "pubspec.yaml" | head -n 1)
          DIR=$(dirname "$PUB")
          echo "Project at $DIR"
          cd "$DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WS-Studio-APK
          path: build/app/outputs/flutter-apk/app-release.apk
