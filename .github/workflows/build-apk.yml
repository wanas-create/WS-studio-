name: Build WS-Studio APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Locate Flutter Project
        id: locate-project
        run: |
          echo "Inspecting repository for Flutter project..."
          KNOWN_PATHS=("." "ws_studio" "ws-studio" "app" "flutter_app" "flutter")
          FLUTTER_DIR=""

          for dir in "${KNOWN_PATHS[@]}"; do
            if [ -f "$dir/pubspec.yaml" ]; then
              FLUTTER_DIR="$dir"
              echo "Found pubspec.yaml in: $dir"
              break
            fi
          done

          if [ -z "$FLUTTER_DIR" ]; then
            echo "::error::pubspec.yaml not found! Checked known paths: ${KNOWN_PATHS[*]}."
            echo "Error: Expected to find Flutter project root with pubspec.yaml in current directory or known subdirectories."
            echo "Please ensure pubspec.yaml exists in your repository root or a valid app subfolder."
            exit 1
          fi

          echo "FLUTTER_DIR=$FLUTTER_DIR" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: |
          cd "$FLUTTER_DIR"
          echo "Running flutter pub get in $FLUTTER_DIR..."
          flutter pub get

      - name: Build Release APK
        run: |
          cd "$FLUTTER_DIR"
          echo "Running flutter build apk --release..."
          flutter build apk --release

      - name: Verify and Locate APK
        run: |
          if [ -f "$FLUTTER_DIR/build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "Found APK at: $FLUTTER_DIR/build/app/outputs/flutter-apk/app-release.apk"
            echo "APK_PATH=$FLUTTER_DIR/build/app/outputs/flutter-apk/app-release.apk" >> "$GITHUB_ENV"
          elif [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "Found APK at: build/app/outputs/flutter-apk/app-release.apk"
            echo "APK_PATH=build/app/outputs/flutter-apk/app-release.apk" >> "$GITHUB_ENV"
          else
            echo "::error::Release APK was not generated at expected path."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WS-Studio-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
